<div class="toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast toast-{{ toast.type }}"
      (click)="toastService.dismiss(toast.id)"
      style="cursor:pointer"
    >
      <span>
        @if (toast.type === 'success') { ✅ }
        @if (toast.type === 'error') { ❌ }
        @if (toast.type === 'info') { ℹ️ }
      </span>
      {{ toast.message }}
    </div>
  }
</div>
