# Pinned so CI, the Dockerfile.dev image and every contributor use one compiler.
#
# 1.92 is the floor, not a preference: `cargo build --all-features` pulls in
# wasmtime 44 and the cranelift crates, which declare rust-version = "1.92.0".
# Keep this in sync with `rust-version` in Cargo.toml and with Dockerfile.dev.
[toolchain]
channel = "1.92"
components = ["clippy", "rustfmt"]
profile = "minimal"
