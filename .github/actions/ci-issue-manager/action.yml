name: 'CI Issue Manager'
description: 'Automatically creates/closes issues on CI job failure/success'
inputs:
  workflow_name:
    description: 'Name of the workflow'
    required: true
  job_status:
    description: 'Status of the job (success/failure)'
    required: true
  job_name:
    description: 'Name of the job that ran'
    required: true
  repo_token:
    description: 'GitHub token for API access'
    required: true
  repository:
    description: 'Repository in owner/repo format'
    required: true
  server_url:
    description: 'GitHub server URL'
    required: true
    default: 'https://github.com'
  run_id:
    description: 'ID of the current workflow run'
    required: true
  ref_name:
    description: 'Branch or tag name'
    required: true
  sha:
    description: 'Commit SHA'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Manage CI Issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.repo_token }}
        WORKFLOW_NAME: ${{ inputs.workflow_name }}
        JOB_STATUS: ${{ inputs.job_status }}
        JOB_NAME: ${{ inputs.job_name }}
        REPO: ${{ inputs.repository }}
        SERVER_URL: ${{ inputs.server_url }}
        RUN_ID: ${{ inputs.run_id }}
        REF_NAME: ${{ inputs.ref_name }}
        COMMIT_SHA: ${{ inputs.sha }}
      run: |
        ISSUE_TITLE="[CI-FAILURE] ${WORKFLOW_NAME}: ${JOB_NAME} failed"
        RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

        if [ "$JOB_STATUS" = "failure" ]; then
          echo "Job failed - creating/updating issue..."
          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --label "ci-failure" \
            --state open \
            --json title,number \
            --jq ".[] | select(.title | startswith(\"[CI-FAILURE] ${WORKFLOW_NAME}\")) | .number" \
            | head -1)

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" \
              --repo "$REPO" \
              --body "$(printf '\u274c Job **%s** failed again in workflow **%s**.\n\nCheck run: %s' "$JOB_NAME" "$WORKFLOW_NAME" "$RUN_URL")"
          else
            echo "Creating new issue"
            BODY=$(printf '## \u274c CI Failure\n\n**Workflow:** %s\n**Job:** %s\n**Run:** %s\n**Branch:** %s\n**Commit:** %s\n\nThe job **%s** failed in workflow **%s**.' \
              "$WORKFLOW_NAME" "$JOB_NAME" "$RUN_URL" "$REF_NAME" "$COMMIT_SHA" "$JOB_NAME" "$WORKFLOW_NAME")
            gh issue create \
              --repo "$REPO" \
              --title "$ISSUE_TITLE" \
              --body "$BODY" \
              --label "ci-failure"
          fi

        elif [ "$JOB_STATUS" = "success" ]; then
          echo "Job succeeded - closing related issues..."
          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --label "ci-failure" \
            --state open \
            --json title,number \
            --jq ".[] | select(.title | startswith(\"[CI-FAILURE] ${WORKFLOW_NAME}\")) | .number" \
            | head -1)

          if [ -n "$EXISTING" ]; then
            echo "Closing issue #$EXISTING"
            gh issue comment "$EXISTING" \
              --repo "$REPO" \
              --body "$(printf '\u2705 Workflow **%s** succeeded. Issue closed automatically.' "$WORKFLOW_NAME")"
            gh issue close "$EXISTING" --repo "$REPO"
          else
            echo "No open issues for ${WORKFLOW_NAME} - nothing to close"
          fi
        fi
