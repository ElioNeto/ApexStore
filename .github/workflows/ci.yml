name: CI / Workflow Validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/actionlint-action@v1

  report-status:
    if: always()
    needs: [validate-workflows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report job status
        uses: ./.github/actions/ci-issue-manager
        with:
          workflow_name: "CI / Workflow Validation"
          job_status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          job_name: "${{ join(needs.*.result, ', ') }}"
          repo_token: ${{ secrets.GITHUB_TOKEN }}
