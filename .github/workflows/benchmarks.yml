name: Benchmarks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2AM UTC for nightly benchmarks
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build benchmarks
        run: cargo build --benches --release

      - name: Run benchmarks (CI mode)
        run: |
          cargo bench \
            --bench write_bench \
            --bench read_bench \
            --bench scan_bench \
            --bench mixed_bench \
            --bench stress_bench \
            -- --noplot 2>&1 | tee bench_output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true
        env:
          CI: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench_output.txt
            target/criterion
          retention-days: 30

      - name: Generate benchmark summary
        if: github.event_name != 'pull_request'
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Guard: abort gracefully if bench output is missing or empty
          if [ ! -s bench_output.txt ]; then
            {
              echo "<!-- BENCHMARK_RESULTS_START -->"
              echo "> \u26a0\ufe0f CI on **${DATE}** — benchmark produced no results. [View run](${RUN_URL})"
              echo ""
              echo "<!-- BENCHMARK_RESULTS_END -->"
            } > bench_block.txt
            perl -i -0pe '
              my $block = do { open my $f, "bench_block.txt" or die; local $/; <$f> };
              s|<!-- BENCHMARK_RESULTS_START -->.*?<!-- BENCHMARK_RESULTS_END -->|$block|gs;
            ' README.md
            exit 0
          fi

          # Format results into a categorised Markdown table
          python3 scripts/format_bench.py

          TABLE=$(cat bench_table.txt)

          {
            echo "<!-- BENCHMARK_RESULTS_START -->"
            echo "> \U0001f916 Auto-updated by CI on **${DATE}** — [View run](${RUN_URL})"
            echo ""
            if [ -n "$TABLE" ]; then
              echo "$TABLE"
            else
              echo "*No results parsed — check the [run artifacts](${RUN_URL}).*"
            fi
            echo ""
            echo "<!-- BENCHMARK_RESULTS_END -->"
          } > bench_block.txt

          perl -i -0pe '
            my $block = do { open my $f, "bench_block.txt" or die; local $/; <$f> };
            s|<!-- BENCHMARK_RESULTS_START -->.*?<!-- BENCHMARK_RESULTS_END -->|$block|gs;
          ' README.md

      - name: Commit updated README
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "ElioNeto"
          git config user.email "netoo.elio@hotmail.com"
          git add README.md

          if git diff --staged --quiet; then
            echo "No README changes to commit."
            exit 0
          fi

          git commit -m "docs: update benchmark results [skip ci]"
          git pull --rebase origin main
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run clippy on benchmarks
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check
