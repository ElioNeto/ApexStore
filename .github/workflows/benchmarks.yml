name: Benchmarks

# Benchmarks only. Formatting and linting live in `ci.yml`; this workflow used to
# duplicate them in a `lint` job.
#
# Not run on push or pull_request: five matrix jobs with a 25-minute timeout on
# every commit is slow, noisy, and produced a stream of no-op
# "docs: update benchmark results" commits on main.
on:
  schedule:
    # 02:00 UTC daily.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - bench: write_bench
            name: Write
          - bench: read_bench
            name: Read
          - bench: scan_bench
            name: Scan
          - bench: mixed_bench
            name: Mixed
          - bench: stress_bench
            name: Stress
          # Declared in Cargo.toml but previously absent from this matrix, so
          # they had never run in CI.
          - bench: latency_bench
            name: Latency
          - bench: write_amplification
            name: Write amplification

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v1
        with:
          toolchain: "1.92"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: bench-${{ matrix.bench }}

      - name: Build benchmark
        run: cargo build --locked --bench ${{ matrix.bench }} --release

      # No continue-on-error: a benchmark that cannot run is a broken pipeline,
      # and masking it is how an empty result reached the README every night.
      - name: Run benchmark
        run: |
          set -o pipefail
          cargo bench --locked --bench ${{ matrix.bench }} -- --noplot \
            2>&1 | tee "bench_output_${{ matrix.bench }}.txt"
        env:
          CI: true

      - name: Fail if the benchmark produced no measurements
        run: |
          if ! grep -q 'time:' "bench_output_${{ matrix.bench }}.txt"; then
            echo "::error::${{ matrix.bench }} produced no 'time:' lines"
            tail -50 "bench_output_${{ matrix.bench }}.txt"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bench-results-${{ matrix.bench }}
          path: bench_output_${{ matrix.bench }}.txt
          retention-days: 30

  publish:
    name: Publish results
    needs: [benchmarks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: bench-results-*
          merge-multiple: true

      - name: Combine benchmark outputs
        run: |
          for bench in write_bench read_bench scan_bench mixed_bench \
                       stress_bench latency_bench write_amplification; do
            f="bench_output_${bench}.txt"
            if [ -f "$f" ]; then
              printf '=== %s ===\n' "$bench"
              cat "$f"
              printf '\n'
            fi
          done > bench_output.txt
          wc -l bench_output.txt

      - name: Render the results table
        run: |
          python3 scripts/format_bench.py
          if [ ! -s bench_table.txt ]; then
            echo "::error::scripts/format_bench.py produced an empty table."
            echo "::error::Criterion's output format probably changed."
            echo "--- first 80 lines of the combined input ---"
            head -80 bench_output.txt
            exit 1
          fi

      # Results go to docs/PERFORMANCE.md, not README.md. Generated content in a
      # hand-maintained file is what created the commit churn, and PERFORMANCE.md
      # is published to the docs site via docs/SUMMARY.md.
      - name: Inject the table into docs/PERFORMANCE.md
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "<!-- BENCHMARK_RESULTS_START -->"
            echo "> Auto-updated by CI on **${DATE}** — [view run](${RUN_URL})"
            echo "> Runner: \`${{ runner.os }}\` (GitHub-hosted). Commit: \`${{ github.sha }}\`."
            echo ""
            cat bench_table.txt
            echo ""
            echo "<!-- BENCHMARK_RESULTS_END -->"
          } > bench_block.txt
          python3 - <<'PY'
          import pathlib, sys
          block = pathlib.Path("bench_block.txt").read_text(encoding="utf-8")
          target = pathlib.Path("docs/PERFORMANCE.md")
          text = target.read_text(encoding="utf-8")
          start = "<!-- BENCHMARK_RESULTS_START -->"
          end = "<!-- BENCHMARK_RESULTS_END -->"
          if start not in text or end not in text:
              sys.exit(f"{target} is missing the {start} / {end} markers")
          head, _, rest = text.partition(start)
          _, _, tail = rest.partition(end)
          target.write_text(head + block.rstrip("\n") + tail, encoding="utf-8")
          PY

      # Only commit when the content actually changed. The previous version
      # committed unconditionally, so an unchanged placeholder still produced a
      # commit on every run.
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/PERFORMANCE.md; then
            echo "No change in docs/PERFORMANCE.md; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/PERFORMANCE.md
          git commit -m "docs: update benchmark results [skip ci]"
          git push
