name: Benchmarks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2AM UTC for nightly benchmarks
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenCode CLI
        id: install_opencode
        run: |
          if command -v opencode &>/dev/null; then
            echo "OpenCode already installed at $(which opencode)"
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "Installing OpenCode..."
            curl -fsSL https://raw.githubusercontent.com/opencode-ai/opencode/main/install.sh | bash
            # The installer typically places it in ~/.opencode/bin or /usr/local/bin
            # Ensure PATH includes the install location
            if [ -f "$HOME/.opencode/bin/opencode" ]; then
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
            elif [ -f "/usr/local/bin/opencode" ]; then
              : # already in PATH
            fi
            echo "cache-hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build benchmarks
        run: cargo build --benches --release

      - name: Run benchmarks (CI mode)
        run: |
          cargo bench \
            --bench write_bench \
            --bench read_bench \
            --bench scan_bench \
            --bench mixed_bench \
            --bench stress_bench \
            -- --noplot 2>&1 | tee bench_output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true
        env:
          CI: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench_output.txt
            target/criterion
          retention-days: 30

      - name: Generate benchmark summary
        if: github.event_name != 'pull_request'
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Guard: abort gracefully if bench output is missing or empty
          if [ ! -s bench_output.txt ]; then
            {
              echo "<!-- BENCHMARK_RESULTS_START -->"
              echo "> \u26a0\ufe0f CI on **${DATE}** — benchmark produced no results. [View run](${RUN_URL})"
              echo ""
              echo "<!-- BENCHMARK_RESULTS_END -->"
            } > bench_block.txt
            perl -i -0pe '
              my $block = do { open my $f, "bench_block.txt" or die; local $/; <$f> };
              s|<!-- BENCHMARK_RESULTS_START -->.*?<!-- BENCHMARK_RESULTS_END -->|$block|gs;
            ' README.md
            exit 0
          fi

          # Format results using Python formatter (primary method)
          FORMAT_OK=false
          if python3 scripts/format_bench.py; then
            TABLE=$(cat bench_table.txt)
            if [ -n "$TABLE" ]; then
              {
                echo "<!-- BENCHMARK_RESULTS_START -->"
                echo "> 🤖 Auto-updated by CI on **${DATE}** — [View run](${RUN_URL})"
                echo ""
                echo "$TABLE"
                echo ""
                echo "<!-- BENCHMARK_RESULTS_END -->"
              } > bench_block.txt
            else
              {
                echo "<!-- BENCHMARK_RESULTS_START -->"
                echo "> 🤖 Auto-updated by CI on **${DATE}** — [View run](${RUN_URL})"
                echo ""
                echo "*No results parsed — check the [run artifacts](${RUN_URL}).*"
                echo ""
                echo "<!-- BENCHMARK_RESULTS_END -->"
              } > bench_block.txt
            fi
            FORMAT_OK=true
          else
            echo "⚠️  Python formatter failed (exit code $?), trying alternatives..." >&2
          fi

          # Direct OpenCode fallback (also used if the script is missing)
          if [ "$FORMAT_OK" != "true" ] && command -v opencode &>/dev/null; then
            echo "Trying direct OpenCode formatting..." >&2
            if FORMATTED=$(opencode run --prompt "Format the following benchmark results as a clean Markdown summary table with columns: Benchmark, Metric, Value. Output ONLY the markdown." < bench_output.txt 2>/dev/null); then
              echo "✅ OpenCode direct formatting succeeded"
              {
                echo "<!-- BENCHMARK_RESULTS_START -->"
                echo "> 🤖 Auto-formatted by OpenCode AI — **${DATE}** — [View run](${RUN_URL})"
                echo ""
                echo "$FORMATTED"
                echo ""
                echo "<!-- BENCHMARK_RESULTS_END -->"
              } > bench_block.txt
              FORMAT_OK=true
            else
              echo "⚠️  Direct OpenCode failed, falling back to Perl parser" >&2
            fi
          fi

          # Fallback: parse using Perl (handles multi-line Criterion output correctly)
          if [ "$FORMAT_OK" != "true" ]; then
            ROWS=$(perl -ne '
              if (/^([a-zA-Z]\S+(?:\/\S+)?)\s*$/) {
                $name = $1;
              }
              elsif (/^([a-zA-Z]\S+(?:\/\S+)?)\s+time:\s+\[([^\]]+)\]/) {
                $name = $1;
                my @vals = split(/\s+/, $2);
                my $median = "$vals[2] $vals[3]";
                $median =~ s/^\s+|\s+$//g;
                print "| `$name` | $median |\n";
                $name = "";
              }
              elsif ($name && /^\s+time:\s+\[([^\]]+)\]/) {
                my @vals = split(/\s+/, $1);
                my $median = "$vals[2] $vals[3]";
                $median =~ s/^\s+|\s+$//g;
                print "| `$name` | $median |\n";
                $name = "";
              }
            ' bench_output.txt)

            {
              echo "<!-- BENCHMARK_RESULTS_START -->"
              echo "> 🤖 Auto-updated by CI on **${DATE}** — [View run](${RUN_URL})"
              echo ""
              if [ -n "$ROWS" ]; then
                echo "| Benchmark | Mediana |"
                echo "|-----------|--------|"
                echo "$ROWS"
              else
                echo "*Nenhum resultado parseado — verifique os [artefatos do run](${RUN_URL}).*"
              fi
              echo ""
              echo "<!-- BENCHMARK_RESULTS_END -->"
            } > bench_block.txt
          fi

          perl -i -0pe '
            my $block = do { open my $f, "bench_block.txt" or die; local $/; <$f> };
            s|<!-- BENCHMARK_RESULTS_START -->.*?<!-- BENCHMARK_RESULTS_END -->|$block|gs;
          ' README.md

      - name: Commit updated README
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "ElioNeto"
          git config user.email "netoo.elio@hotmail.com"
          git add README.md

          if git diff --staged --quiet; then
            echo "No README changes to commit."
            exit 0
          fi

          git commit -m "docs: update benchmark results [skip ci]"
          git pull --rebase origin main
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run clippy on benchmarks
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  report-status:
    if: always()
    needs: [benchmarks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report job status
        uses: ./.github/actions/ci-issue-manager
        with:
          workflow_name: "Benchmarks"
          job_status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          job_name: "${{ join(needs.*.result, ', ') }}"
          repo_token: ${{ secrets.GITHUB_TOKEN }}
