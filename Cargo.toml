[package]
name = "apex-store-rs"
version = "2.2.7"
edition = "2021"
authors = ["Elio Neto <netoo.elio@hotmail.com>"]
license = "MIT"
repository = "https://github.com/ElioNeto/ApexStore"
homepage = "https://github.com/ElioNeto/ApexStore"
documentation = "https://elioneto.github.io/ApexStore/"
readme = "README.md"
description = "A high-performance, embedded LSM-tree storage engine with SSTable V2 format, LZ4 compression, and Bloom Filters."
keywords = ["database", "lsm-tree", "key-value", "storage-engine", "embedded"]
categories = ["database-implementations", "data-structures"]
exclude = [
    "data/*",
    "target/*",
    "*.sst",
    "*.log",
    ".env",
    "docs/assets/*"
]

[[bin]]
name = "apexstore-server"
path = "src/bin/server.rs"

[[bin]]
name = "apexstore-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "apexstore-tui"
path = "src/bin/tui.rs"

[lib]
name = "apexstore"
path = "src/lib.rs"

[features]
default = ["api"]
api = []
chaos = []
wasm = ["dep:wasmtime"]

[dependencies]
wasmtime = { version = "44", optional = true }
bloomfilter = "3.0"
crc32fast = "1.4"
postcard = { version = "1.0", features = ["alloc"] }
lz4_flex = "0.11.6"  # fix RUSTSEC-2026-0041 (was 0.11.5)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
twox-hash = "2.1"
moka = { version = "0.12", features = ["sync"] }
rayon = "1.11"
uuid = { version = "1.22", features = ["v4", "serde"] }
actix-web = { version = "4.12", features = ["rustls"] }
actix-http = "3"
rustls = "0.20"
rustls-pemfile = "1"

actix-rt = "2.11"
actix-cors = "0.7"
actix-web-httpauth = "0.8"
async-graphql = "7"
async-graphql-actix-web = "7"
tokio = { version = "1.49", features = ["full"] }
dotenvy = "0.15"
sha2 = "0.10"
base64 = "0.22"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.24"
opentelemetry = "0.23"
opentelemetry_sdk = { version = "0.23", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.16", features = ["trace", "metrics", "grpc-tonic"] }
rand = "0.8"
fs2 = "0.4"
# TUI dependencies
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
chrono = { version = "0.4", features = ["serde"] }
tui-input = "0.10"
clap = { version = "4.5", features = ["derive"] }
bytes = "1.11.1"  # fix RUSTSEC-2026-0007 (integer overflow in BytesMut::reserve)
time = "0.3.47"  # fix RUSTSEC-2026-0009 (DoS via stack exhaustion)
aes-gcm = "0.10"
hex = "0.4"
memmap2 = "0.9"
csv = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ureq = "2.12"
sqlparser = "0.45"
jsonschema = "0.18"
actix-ws = "0.3"
dashmap = "6"
regex-lite = "0.1"
futures = "0.3"
tempfile = "3.24"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
fail = "0.4"
futures = "0.3"
proptest = "1.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bench]]
name = "write_bench"
harness = false

[[bench]]
name = "read_bench"
harness = false

[[bench]]
name = "mixed_bench"
harness = false

[[bench]]
name = "scan_bench"
harness = false

[[bench]]
name = "stress_bench"
harness = false

[[bench]]
name = "write_amplification"
harness = false

[[bench]]
name = "latency_bench"
harness = false

[profile.bench]
inherits = "release"
