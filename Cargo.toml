[package]
name = "apex-store-rs"
version = "2.2.7"
edition = "2021"
# Floor imposed by wasmtime 49 and the cranelift crates under --all-features.
rust-version = "1.96"
authors = ["Elio Neto <netoo.elio@hotmail.com>"]
license = "MIT"
repository = "https://github.com/ElioNeto/ApexStore"
homepage = "https://github.com/ElioNeto/ApexStore"
documentation = "https://elioneto.github.io/ApexStore/"
readme = "README.md"
# Without this, `cargo run` fails: the crate exposes four binaries
# (apex-store-rs, apexstore-cli, apexstore-server, apexstore-tui).
default-run = "apexstore-server"
description = "A high-performance, embedded LSM-tree storage engine with SSTable V2 format, LZ4 compression, and Bloom Filters."
keywords = ["database", "lsm-tree", "key-value", "storage-engine", "embedded"]
categories = ["database-implementations", "data-structures"]
exclude = [
    "data/*",
    "target/*",
    "*.sst",
    "*.log",
    ".env",
    "docs/assets/*"
]

[[bin]]
name = "apexstore-server"
path = "src/bin/server.rs"

[[bin]]
name = "apexstore-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "apexstore-tui"
path = "src/bin/tui.rs"

[lib]
name = "apexstore"
path = "src/lib.rs"

[features]
default = ["api"]
api = []
chaos = []
wasm = ["dep:wasmtime"]

[dependencies]
wasmtime = { version = "49.0.5", optional = true }
bloomfilter = "3.0"
crc32fast = "1.4"
postcard = { version = "1.0", features = ["alloc"] }
lz4_flex = "0.11.6"  # fix RUSTSEC-2026-0041 (was 0.11.5)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
twox-hash = "2.1"
moka = { version = "0.12", features = ["sync"] }
rayon = "1.11"
uuid = { version = "1.22", features = ["v4", "serde"] }
actix-web = { version = "4.16", default-features = false, features = ["http2-native", "compat", "macros", "ws", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "rustls-0_23"] }
actix-http = "3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

actix-rt = "2.11"
actix-cors = "0.7"
actix-web-httpauth = "0.8"
async-graphql = "7"
# HTTP/2 is enabled through actix-web/http2-native above. The adapter
# default would re-enable the legacy h2 0.3 compatibility dependency.
async-graphql-actix-web = { version = "7", default-features = false }
tokio = { version = "1.49", features = ["full"] }
dotenvy = "0.15"
sha2 = "0.10"
base64 = "0.22"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["trace", "metrics", "grpc-tonic"] }
rand = "0.10"
fs2 = "0.4"
# TUI dependencies
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
chrono = { version = "0.4", features = ["serde"] }
tui-input = "0.10"
clap = { version = "4.5", features = ["derive"] }
bytes = "1.11.1"  # fix RUSTSEC-2026-0007 (integer overflow in BytesMut::reserve)
time = "0.3.47"  # fix RUSTSEC-2026-0009 (DoS via stack exhaustion)
aes-gcm = "0.10"
hex = "0.4"
memmap2 = "0.9"
csv = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
ureq = "3.5"
sqlparser = "0.45"
jsonschema = "0.18"
actix-ws = "0.4"
dashmap = "6"
regex-lite = "0.1"
futures = "0.3"
tempfile = "3.24"

[dev-dependencies]
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace", "metrics"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tokio-stream = { version = "0.1", features = ["net"] }
rcgen = "0.14"
criterion = { version = "0.5", features = ["html_reports"] }
fail = "0.4"
futures = "0.3"
proptest = "1.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Worker recovery uses catch_unwind. Accept unwind metadata and its binary-size
# and runtime cost so a worker panic does not abort the entire server.
panic = "unwind"

[[bench]]
name = "write_bench"
harness = false

[[bench]]
name = "read_bench"
harness = false

[[bench]]
name = "mixed_bench"
harness = false

[[bench]]
name = "scan_bench"
harness = false

[[bench]]
name = "stress_bench"
harness = false

[[bench]]
name = "write_amplification"
harness = false

[[bench]]
name = "latency_bench"
harness = false

[profile.bench]
inherits = "release"

# Temporary native HTTP/2 backend from upstream PR #4321. Keep both crates
# on the same reviewed revision; remove when a compatible release is published.
[patch.crates-io]
actix-web = { git = "https://github.com/actix/actix-web.git", rev = "4537c9f5b407c6f7c0e8037b87b8bebbf6388d80" }
actix-http = { git = "https://github.com/actix/actix-web.git", rev = "4537c9f5b407c6f7c0e8037b87b8bebbf6388d80" }
